# Concentrator application constants.
#
# This file sits next to Concentrator.exe and can be edited without rebuilding: restart the
# application to apply a change. Every key is required; an unknown, missing or invalid key stops
# the start-up with an explicit error. Ranges are given in brackets.
#
# Path tokens: {appdata} (%APPDATA%), {localappdata} (%LOCALAPPDATA%), {app_dir} (folder of the exe).
# Comment lines start with "#" or ";".

[app]
name = Concentrator
organization = skire666
# Windows AppUserModelID: groups the taskbar buttons under Concentrator [<= 128 chars].
app_user_model_id = skire666.Concentrator
# Name of the per-user lock and of the local server used to refuse a second instance [A-Z a-z 0-9 _ . -].
single_instance_key = concentrator
# How long a second instance waits for the first one to answer [100..10000 ms].
single_instance_timeout_ms = 1000

[paths]
# Proposed at first launch when creating the user data file.
default_data_file = {appdata}/Concentrator/concentrator.toml
# Window geometry, splitters, column widths, sorts and the chosen data file.
ui_state_file = {appdata}/Concentrator/ui-state.ini
log_dir = {localappdata}/Concentrator/logs
backup_dir = {appdata}/Concentrator/backups

[ui]
# Width of the left module bar [40..400 px].
module_bar_width_px = 100
# Initial width share of zone 1 (TODO manager) on the Focus page [30..90 %].
zone1_ratio_percent = 70
# Window size at first launch and minimum size [320..10000 px; minimum <= default].
default_window_width_px = 1400
default_window_height_px = 860
min_window_width_px = 1000
min_window_height_px = 640
# Minimum delay before the same action can run again [100..5000 ms].
action_cooldown_ms = 100
# Actions slower than this are logged at INFO level [1..60000 ms].
slow_action_threshold_ms = 200
# Darkening of the main window behind a dialog [0..50 %] (ADR-036).
dialog_overlay_opacity_percent = 10
# Minimum width of the first-run and recovery dialogs [320..10000 px].
startup_dialog_min_width_px = 560
# Space between the parts of a dialog [0..50 px].
dialog_spacing_px = 10
# Font of the timer digits (a monospaced font keeps the width steady) and its size [8..400 px].
timer_font_family = Cascadia Mono
timer_font_size_px = 64
# The digits of a ringing timer blink at this period [100..5000 ms].
alert_blink_interval_ms = 500

[storage]
# A save starts this long after the last change [50..10000 ms]...
save_debounce_ms = 500
# ...and at the latest this long after the first unsaved change, even if changes keep coming
# [500..60000 ms; not lower than save_debounce_ms]. At most this much work is lost on a crash.
save_max_delay_ms = 1500
# Replacing the data file is retried when another program (antivirus, indexer, sync client)
# holds it [0..20 retries, 10..5000 ms between retries].
replace_retry_count = 5
replace_retry_delay_ms = 200
# After a failed save, the next automatic attempt comes this much later [1000..600000 ms].
failed_save_retry_ms = 10000
# Longest wait for pending changes to be written when Concentrator closes [500..60000 ms].
shutdown_flush_timeout_ms = 5000
# Longest wait for a file operation at start-up: create, restore, rename [500..60000 ms].
blocking_write_timeout_ms = 5000
# One copy of the data file per day in backup_dir, kept this many days [true/false, 1..365 days].
daily_backup_enabled = true
daily_backup_retention_days = 7

[timer]
# Period of the heartbeat driving the timer, the hourly chime and the journal [10..1000 ms].
tick_interval_ms = 100
# Length of a snooze [1..1440 min].
snooze_minutes = 5
# Countdown of a new data file and the allowed range [1..359999 s, i.e. up to 99:59:59;
# min <= default <= max].
default_duration_seconds = 1500
min_duration_seconds = 1
max_duration_seconds = 359999
# Alarm of a new data file. default_sound is a built-in sound: a file name of assets/sounds without
# ".mp3"; an alarm sound that cannot be found falls back to it. Volume [0..100], number of plays
# [1..max_loop_count, max 1..999].
default_sound = alarm
default_volume = 80
default_loop_count = 3
max_loop_count = 99
# The alarm stops by itself after this delay, 0 = never [0, or min..max]; range [1..86400 s].
default_auto_stop_seconds = 120
min_auto_stop_seconds = 5
max_auto_stop_seconds = 3600
# Favorites of a data file that has none yet, in minutes, separated by commas: unique, within the
# duration range above, at most max_presets values (empty = no favorite).
default_presets_minutes = 15, 30, 45
# Highest number of favorites [1..50] and longest favorite label [1..200 characters]. A data file
# above these limits cannot be opened until the limits are raised again.
max_presets = 12
max_preset_label_length = 40

[chime]
# Hourly chime of a new data file: switched on or off [true/false], built-in sound (a file name of
# assets/sounds without ".mp3"; a chime sound that cannot be found falls back to it), volume [0..100],
# first and last full hour that chime [0..23; start <= end; 0 and 23 = all day].
default_enabled = false
default_sound = chime
default_volume = 60
default_start_hour = 8
default_end_hour = 20
# The chime of H:00 still plays if Concentrator notices the new hour this late, for example after a
# busy moment [1..3599 s]. An hour noticed later (sleep, clock change) is skipped.
trigger_window_seconds = 59

[todo]
# Longest task text [1..100000 characters], list name [1..500] and list description [0..100000]. A data
# file above these limits cannot be opened until the limits are raised again.
max_task_text_length = 5000
max_list_name_length = 80
max_list_description_length = 2000
# Events kept in the history of a task, the creation included [1..1000]; older ones are dropped.
max_history_events = 10
# Largest interval of a repeating task ("every N days, weeks, months or years") [1..9999] and largest
# number of occurrences of a series that ends after a count [1..99999].
max_recurrence_interval = 999
max_recurrence_count = 9999
# Dates shown after the due date in the preview of the Repeat section of the task dialog [1..20].
recurrence_preview_count = 4
# Delay after the last key press before the task search applies [0..2000 ms].
search_debounce_ms = 150
# The task column shows the lines of a task one after the other; a text wider than this share of the
# column is cut there and followed by "... (N lines)" [10..100 %].
text_width_percent = 78
# Priority proposed for a new list and given to the first list (Inbox): LOW, NORMAL, HIGH or URGENT.
default_list_priority = NORMAL
# Task table order until the user clicks a column: STATE, TEXT, DUE, CREATED or UPDATED, and the
# direction [true = newest or highest first].
default_sort = CREATED
default_sort_descending = true
# Initial height share of the task table above the details pane [20..95 %].
default_table_ratio_percent = 75
# Initial widths of the state, list, due, repeat, times, links, created and updated columns, separated by
# commas; the task column takes the rest [8 values, 20..2000 px].
default_column_widths_px = 60, 120, 140, 130, 50, 50, 140, 140

[logging]
# DEBUG, INFO, WARNING, ERROR or CRITICAL.
level = INFO
# Log file name inside log_dir (no folder).
file_name = concentrator.log
# Rotation size [10000..1000000000 bytes] and number of rotated files kept [0..100].
file_max_bytes = 2000000
file_backup_count = 5
# Number of recent records kept in memory for the Journal page [100..100000].
journal_buffer_size = 5000

[journal]
# The journal search applies this long after the last key press [0..2000 ms].
search_debounce_ms = 150
# Copy puts at most this many entries in the clipboard, the most recent ones [1..100000].
copy_max_rows = 2000
# Initial height share of the entry table above the detail pane [20..95 %].
default_table_ratio_percent = 70
# Initial widths of the time, level, source and thread columns, separated by commas; the message
# column takes the rest [4 values, 20..2000 px].
default_column_widths_px = 110, 90, 240, 120

[settings]
# General settings of a new data file, and of a file written before they existed.
# Journal detail level: DEBUG, INFO, WARNING, ERROR or CRITICAL.
default_log_level = INFO
# Flash the taskbar button when the timer rings while Concentrator is not the active window [true/false].
default_notify_when_inactive = true

[links]
# A line of a task that holds only a web address of these schemes, a drive path (C:\... or D:/...) or a
# network path (\\server\share) is a clickable link, opened as it is (separated by commas).
url_schemes = http, https
# Most links listed by "Open link" in the context menu of a task [1..50].
max_links_in_menu = 10

[i18n]
# UI language at first launch and language used for missing texts: en or fr.
default_language = en
fallback_language = en
